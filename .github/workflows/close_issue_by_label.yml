name: 自动关闭Issue

on:
  issues:
    types:
      - labeled

permissions:
  issues: write

jobs:
  close_issue:
    runs-on: ubuntu-latest

    steps:
      - name: 判断Label并关闭Issue
        uses: actions/github-script@v7
        with:
          script: |
            const label = context.payload.label.name;
            const issue = context.issue;

            let comment = "";

            if (label === "已完成") {
              comment = `
## ✅ Issue 已完成

感谢你的反馈！

该问题/建议已经完成处理，我们将在后续版本中发布相关修复或内容更新。

感谢你对项目的支持！
              `;
            }

            else if (label === "不予处理") {
              comment = `
## ❌ Issue 不予处理

感谢你的反馈。

经过评估，该 Issue 所描述的问题或建议目前与项目方向不符，因此我们暂不进行处理。

如果未来项目方向发生调整，我们可能会重新考虑该内容。

感谢理解！
              `;
            }

            else if (label === "无法修复") {
              comment = `
## ❌ Issue 无法修复

感谢你的反馈。

经过分析，该问题目前由于技术限制、依赖限制或其他原因，暂时无法进行修复。

如果未来出现新的解决方案，我们可能会重新评估该问题。

感谢你的理解与支持！
              `;
            }

            else {
              return;
            }


            // 添加评论
            await github.rest.issues.createComment({
              ...issue,
              body: comment
            });


            // 关闭Issue
            await github.rest.issues.update({
              ...issue,
              state: "closed"
            });
