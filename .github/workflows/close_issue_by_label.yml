name: Close issues with triage labels

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  close-labeled-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Close issue and leave a label-specific comment
        uses: actions/github-script@v7
        with:
          script: |
            const labelComments = {
              "✔已完成": [
                "此 Issue 已标记为「✔已完成」，相关工作已完成，因此现将其关闭。",
                "",
                "感谢你提交问题并帮助改进项目！",
              ].join("\n"),
              "❌不予处理": [
                "此 Issue 已标记为「❌不予处理」，根据项目维护决定不继续处理，因此现将其关闭。",
                "",
                "感谢你的反馈；如果后续情况或项目范围发生变化，欢迎补充信息后重新讨论。",
              ].join("\n"),
              "❌无法修复": [
                "此 Issue 已标记为「❌无法修复」。目前受现有技术条件或项目限制，无法提供可行的修复方案，因此现将其关闭。",
                "",
                "如果之后发现新的复现步骤、环境信息或解决线索，欢迎补充并重新开启讨论。",
              ].join("\n"),
            };

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const addedLabel = context.payload.label?.name;
            if (!Object.hasOwn(labelComments, addedLabel)) {
              core.info("The added label is not configured for automatic closure.");
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number,
            });
            const marker = `<!-- auto-close: label=${addedLabel} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const alreadyCommented = comments.some((comment) =>
              comment.body?.includes(marker)
            );

            if (issue.state !== "closed") {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: "closed",
              });
            }

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: `${labelComments[addedLabel]}\n\n${marker}`,
              });
            }
