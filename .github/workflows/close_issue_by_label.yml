name: Close reviewed issues

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write

jobs:
  close-reviewed-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Close issue when all review labels are present
        uses: actions/github-script@v7
        with:
          script: |
            const requiredLabels = ["✔已完成", "❌不予处理", "❌无法修复"];
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number,
            });

            const issueLabels = new Set(issue.labels.map((label) => label.name));
            if (!requiredLabels.every((label) => issueLabels.has(label))) {
              core.info("The issue does not have all required labels; leaving it unchanged.");
              return;
            }

            const marker = "<!-- auto-close: reviewed-labels -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const alreadyCommented = comments.some((comment) =>
              comment.body?.includes(marker)
            );

            if (issue.state !== "closed") {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: "closed",
              });
            }

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: [
                  "此 Issue 已同时标记为「✔已完成」「❌不予处理」和「❌无法修复」，",
                  "因此根据项目流程自动关闭。",
                  "",
                  "感谢反馈与协助！如果之后有新的信息或可复现步骤，欢迎重新开启此 Issue，或提交新的 Issue。",
                  "",
                  marker,
                ].join("\n"),
              });
            }
